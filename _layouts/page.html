---
layout: default
---
{%- assign lang = page.lang | default: site.default_lang -%}
{%- assign t = site.data.i18n[lang] -%}
<div class="wrap">
  <header class="page-head">
    {%- if page.kicker %}<p class="field-note">{{ page.kicker }}</p>{% endif %}
    <h1 class="display">{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose {% if page.wide %}prose-wide{% endif %}">
    {{ content }}
  </div>
</div>
